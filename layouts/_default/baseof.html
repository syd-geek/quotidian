<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ .Title }}</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 750px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
        background-color: #000000;
        color: #ffaa33; /* LCARS Amber/Gold */
      }

      nav {
        margin-bottom: 30px;
        border-bottom: 2px solid #ff6600; /* LCARS Orange Accent */
        padding-bottom: 10px;
      }

      nav a {
        margin-right: 15px;
        text-decoration: none;
        color: #cc99cc; /* LCARS Lavender/Pink */
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      nav a:hover {
        color: #ff99cc;
        text-decoration: underline;
      }

      pre {
        background: #111122; /* Deep dark blue-grey terminal backing */
        padding: 15px;
        border-radius: 6px;
        border-left: 4px solid #ff9900;
        overflow-x: auto;
      }

      code {
        font-family: monospace;
        background: #111122;
        color: #66ccff; /* LCARS Blue data readout */
        padding: 2px 4px;
        border-radius: 3px;
      }

      pre code {
        padding: 0;
        background: none;
        color: #ffaa33;
      }

      h2,
      h3,
      h4 {
        color: #66ccff;
        border-bottom: 2px solid #ff6600;
        padding-bottom: 5px;
      }

      a {
        color: #cc99cc;
        text-decoration: none;
      }

      a:hover {
        color: #ff99cc;
        text-decoration: underline;
      }
      /* body { font-family: sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        nav { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        code { font-family: monospace; background: #f4f4f4; padding: 2px 4px; border-radius: 3px; }
        pre code { padding: 0; background: none; }
        a { color: #0000FF; text-decoration: none; } */
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/log/">Log</a>
    </nav>

    <main>{{ block "main" . }}{{ .Content }}{{ end }}</main>
  </body>
</html>
