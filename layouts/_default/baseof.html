<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ .Title }}</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 750px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
        background-color: #000000;
        color: #ffaa33; /* LCARS Amber/Gold */
      }

      nav {
        margin-bottom: 30px;
        border-bottom: 2px solid #ff6600; /* LCARS Orange Accent */
        padding-bottom: 10px;
      }

      nav a {
        margin-right: 15px;
        text-decoration: none;
        color: #cc99cc; /* LCARS Lavender/Pink */
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      nav a:hover {
        color: #ff99cc;
        text-decoration: underline;
      }

      pre {
        background: #111122; /* Deep dark blue-grey terminal backing */
        padding: 15px;
        border-radius: 6px;
        border-left: 4px solid #ff9900;
        overflow-x: auto;
      }

      code {
        font-family: monospace;
        background: #111122;
        color: #66ccff; /* LCARS Blue data readout */
        padding: 2px 4px;
        border-radius: 3px;
      }

      pre code {
        padding: 0;
        background: none;
        color: #ffaa33;
      }

      h2,
      h3,
      h4 {
        color: #66ccff;
        border-bottom: 2px solid #ff6600;
        padding-bottom: 5px;
      }

      hr {
        border: none;
        border-top: 2px solid #ff6600;
        margin: 40px 0;
      }

      small {
        color: #8aa9b5;
      }

      a {
        color: #cc99cc;
        text-decoration: none;
      }

      a:hover {
        color: #ff99cc;
        text-decoration: underline;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0;
        list-style: none;
      }

      .tag-list a {
        display: inline-block;
        padding: 3px 10px;
        border: 1px solid #8a668a;
        border-radius: 5px;
        color: #8aa9b5;
        font-size: 0.85em;
        line-height: 1.4;
      }

      .tag-list a:hover {
        border-color: #b86f3c;
        background: #25202a;
        color: #ffaa33;
        text-decoration: none;
      }

      .zettel-index {
        padding-left: 2.5rem;
      }

      .zettel-all-notes {
        margin-top: 2.5rem;
      }

      .zettel-entry {
        padding: 0 0 1.25rem 0.5rem;
      }

      .zettel-entry + .zettel-entry {
        border-top: 1px solid #55445d;
        padding-top: 1.25rem;
      }

      .zettel-entry h2 {
        margin: 0.15rem 0;
        border: 0;
      }

      .zettel-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
        gap: 12px;
        margin-top: 16px;
        padding-top: 12px;
      }

      .zettel-links h2 {
        margin: 0 0 8px;
        color: #8aa9b5;
        font-size: 0.9em;
        border: 0;
        padding: 0;
      }

      .zettel-links ul {
        margin: 0;
        padding-left: 1.25rem;
      }

      .site-footer {
        margin-top: 40px;
        padding-top: 16px;
        border-top: 2px solid #ff6600;
      }

      .web-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .web-badge {
        box-sizing: border-box;
        width: 88px;
        height: 31px;
        display: grid;
        grid-template-columns: 24px 1fr;
        align-items: center;
        gap: 3px;
        padding: 2px 4px;
        border: 3px outset #cc99cc;
        background: linear-gradient(135deg, #30304a, #111122 55%, #25253a);
        color: #ffaa33;
        font-family: monospace;
        font-size: 7px;
        font-weight: bold;
        line-height: 1.1;
        text-align: left;
        text-decoration: none;
        text-transform: uppercase;
        box-shadow: 1px 1px 0 #000;
      }

      .badge-icon {
        width: 22px;
        height: 22px;
        image-rendering: pixelated;
      }

      .badge-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
        white-space: nowrap;
      }

      .badge-copy strong {
        color: #66ccff;
        font-size: 9px;
      }

      .web-badge:hover {
        color: #ff99cc;
        text-decoration: none;
      }

      .web-badge:hover .badge-copy strong {
        color: #ff99cc;
      }

        nav { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        code { font-family: monospace; background: #f4f4f4; padding: 2px 4px; border-radius: 3px; }
        pre code { padding: 0; background: none; }
        a { color: #0000FF; text-decoration: none; } */
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/log/">Log</a>
      <a href="/dots/">Dots</a>
      <a href="/books/">Books</a>
    </nav>

    <main>{{ block "main" . }}{{ .Content }}{{ end }}</main>

    <footer class="site-footer">
      <div class="web-badges" aria-label="Web badges">
        <span class="web-badge" role="img" aria-label="Hand-crafted HTML">
          <svg class="badge-icon" viewBox="0 0 22 22" aria-hidden="true">
            <path
              fill="#66ccff"
              d="M2 3h7v3H5v4H2zm11 0h7v7h-3V6h-4zM2 13h3v4h4v3H2zm15 0h3v7h-7v-3h4z"
            />
            <path fill="#ffaa33" d="M9 10h4v3H9zM6 8h3v3H6zm7 3h3v3h-3z" />
            <path fill="#cc99cc" d="M10 6h3v3h-3zm-4 8h3v3H6zm7-2h3v3h-3z" />
          </svg>
          <span class="badge-copy">HAND-CRAFTED<strong>HTML</strong></span>
        </span>
        <span
          class="web-badge"
          role="img"
          aria-label="Best viewed with curiosity"
        >
          <svg class="badge-icon" viewBox="0 0 22 22" aria-hidden="true">
            <path fill="#cc99cc" d="M3 2h16v13H3z" />
            <path fill="#111122" d="M5 4h12v9H5z" />
            <path fill="#66ccff" d="M7 6h3v2H7zm5 0h3v2h-3zM8 10h6v1H8z" />
            <path fill="#ffaa33" d="M9 15h4v2h4v2H5v-2h4z" />
          </svg>
          <span class="badge-copy">BEST VIEWED<strong>CURIOUSLY</strong></span>
        </span>
      </div>
    </footer>
  </body>
</html>
