{{ define "main" }}
  {{ .Content }}
    <h2>Log</h2>
    <ul>
    {{ range where site.RegularPages "Section" "log" }}
      <li>
        <a href="{{ .RelPermalink }}">
          <time datetime="{{ .Date.Format "2006-01-02" }}">
            {{ .Date.Format "2006-01-02" }}:
          </time>{{ .Title }}
        </a>
      </li>
    {{ end }}
  </ul>
  <h2>Dots</h2>
  <p>A web of interconnected ideas.</p>
  <p><a href="/dots/">Explore the idea network</a></p>
  {{ partial "tags.html" .}}
{{ end }}
