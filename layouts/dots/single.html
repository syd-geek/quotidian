{{ define "main" }}
  <p><a href="/dots/">&larr; Dots index</a></p>
  <article>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ with .Params.parent }}
      {{ with site.GetPage (printf "/dots/%s" .) }}
        <p>Part of <a href="{{ .RelPermalink }}">{{ .Title }}</a>.</p>
      {{ end }}
    {{ end }}
    {{ partial "dots/links.html" . }}
  </article>
{{ end }}
