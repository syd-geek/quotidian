{{ define "main" }}
  <p><a href="/books/">&larr; Books</a></p>
  <article>
    <h1>{{ .Title }}</h1>
    {{ with .Params.book_author }}<p>By {{ . }}</p>{{ end }}
    {{ with .Params.rating }}<p>Rating: {{ . }}/5</p>{{ end }}
    {{ with .Params.cover }}
      <figure>
        <img src="{{ . | relURL }}" alt="Cover of {{ $.Title }}" />
        {{ with $.Params.cover_attribution }}<figcaption>{{ . }}</figcaption>{{ end }}
      </figure>
    {{ end }}
    {{ .Content }}
  </article>
{{ end }}
